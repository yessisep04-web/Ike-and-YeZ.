<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>IKE & YEZ — Where Are We Going?</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#15101f;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
canvas{display:block}
#game{position:fixed;inset:0}
#hud{position:fixed;inset:0;pointer-events:none}
#top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:10px}
.panel{background:rgba(20,15,30,.78);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:10px 12px;backdrop-filter:blur(8px)}
#who{font-weight:800}
#objective{max-width:55vw;font-size:13px}
#stats{position:absolute;left:12px;bottom:135px;display:flex;gap:7px;flex-wrap:wrap;max-width:65vw}
.stat{font-size:12px}
#select{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(rgba(15,9,25,.55),rgba(15,9,25,.82));z-index:20}
#selectBox{width:min(92vw,720px);padding:24px;text-align:center}
#selectBox h1{font-size:clamp(28px,8vw,56px);margin:0 0 6px}
#selectBox p{opacity:.82;margin:0 0 22px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{border:2px solid rgba(255,255,255,.18);border-radius:22px;padding:20px;background:rgba(255,255,255,.07);color:#fff}
.card:active{transform:scale(.98)}
.avatar{height:150px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:76px;margin-bottom:12px}
.ike .avatar{background:linear-gradient(145deg,#4b2b72,#a875e6)}
.yez .avatar{background:linear-gradient(145deg,#9d356e,#f28fc0)}
.card h2{margin:4px 0}
.card small{opacity:.8}
#controls{position:fixed;inset:0;pointer-events:none;z-index:10}
#stick{position:absolute;left:22px;bottom:24px;width:128px;height:128px;border-radius:50%;background:rgba(255,255,255,.11);border:2px solid rgba(255,255,255,.2);pointer-events:auto}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;background:rgba(255,255,255,.34);border:2px solid rgba(255,255,255,.45)}
.actions{position:absolute;right:18px;bottom:18px;width:190px;height:185px;pointer-events:none}
.btn{position:absolute;width:58px;height:58px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(28,21,40,.86);color:#fff;font-weight:800;font-size:11px;pointer-events:auto}
.btn:active{transform:scale(.92);background:rgba(255,255,255,.25)}
#attack{right:0;top:48px;width:72px;height:72px}
#dodge{left:48px;bottom:0}
#guard{left:0;top:78px}
#interact{right:24px;top:0}
#ability{left:52px;top:56px;background:rgba(125,72,180,.88)}
#lock{position:absolute;right:15px;top:92px;width:52px;height:42px;border-radius:14px;border:1px solid rgba(255,255,255,.25);background:rgba(20,15,30,.8);color:#fff;font-weight:800;pointer-events:auto}
#switch{position:absolute;right:15px;top:142px;width:88px;height:42px;border-radius:14px;border:1px solid rgba(255,255,255,.25);background:rgba(20,15,30,.8);color:#fff;font-weight:800;pointer-events:auto}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;background:rgba(20,15,30,.82);border-radius:12px;padding:7px 12px;font-size:12px;opacity:.9}
#toast{position:fixed;left:50%;top:78px;transform:translateX(-50%);background:rgba(20,15,30,.9);border-radius:14px;padding:10px 15px;z-index:30;display:none;font-weight:700}
@media(max-width:480px){#objective{max-width:48vw}.avatar{height:120px}.actions{transform:scale(.9);transform-origin:right bottom}.cards{gap:9px}.card{padding:13px}}
</style>
</head>
<body>
<div id="game"></div>

<div id="select">
  <div id="selectBox" class="panel">
    <h1>IKE & YEZ</h1>
    <p>Where are we going?</p>
    <div class="cards">
      <button class="card ike" id="chooseIke">
        <div class="avatar">🧍🏾‍♂️</div>
        <h2>IKE</h2><small>Shield • Charm • Tactical Insight</small>
      </button>
      <button class="card yez" id="chooseYez">
        <div class="avatar">🧍🏾‍♀️</div>
        <h2>YEZ</h2><small>Flood • Gorilla Rage • Lovey-Dovey</small>
      </button>
    </div>
  </div>
</div>

<div id="hud">
  <div id="top">
    <div class="panel"><div id="who">Choose a character</div><div id="objective">Explore the Beginning</div></div>
    <div class="panel" id="mission">MISSION 1</div>
  </div>
  <div id="stats">
    <div class="panel stat">HP <b id="hp">100</b></div>
    <div class="panel stat">Connection <b id="connection">0</b></div>
    <div class="panel stat">Tension <b id="tension">0</b></div>
    <div class="panel stat">Orbs <b id="orbs">0</b>/5</div>
  </div>
</div>

<div id="controls">
  <div id="stick"><div id="knob"></div></div>
  <div class="actions">
    <button class="btn" id="interact">INTERACT</button>
    <button class="btn" id="attack">ATTACK</button>
    <button class="btn" id="guard">GUARD</button>
    <button class="btn" id="ability">ABILITY</button>
    <button class="btn" id="dodge">DODGE</button>
  </div>
  <button id="lock">LOCK</button>
  <button id="switch">SWITCH</button>
  <div id="hint">Move • explore • fight • solve</div>
</div>
<div id="toast"></div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

const game=document.querySelector("#game");
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x211735);
scene.fog=new THREE.Fog(0x211735,35,105);

const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,180);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
game.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffddff,0x24172d,2.2));
const sun=new THREE.DirectionalLight(0xffffff,2.2);
sun.position.set(12,25,10); sun.castShadow=true; scene.add(sun);

const ground=new THREE.Mesh(new THREE.CylinderGeometry(42,46,1.2,64),new THREE.MeshStandardMaterial({color:0x5d3d68}));
ground.position.y=-.6; ground.receiveShadow=true; scene.add(ground);

const paths=[];
function box(x,y,z,w,h,d,c=0x76518c){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c}));
 m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;
}
function orb(x,z){
 const m=new THREE.Mesh(new THREE.IcosahedronGeometry(.55,1),new THREE.MeshStandardMaterial({color:0xffd86b,emissive:0x7a4d16,emissiveIntensity:.7}));
 m.position.set(x,1,z);m.userData.orb=true;scene.add(m);return m;
}
for(const p of [[-13,-9],[12,-13],[-18,10],[18,12],[3,18]]) orb(...p);
box(0,1,-18,12,2,2,0x4d315f);
box(-18,1,0,2,2,12,0x4d315f);
box(18,1,0,2,2,12,0x4d315f);

const portal=new THREE.Mesh(new THREE.TorusGeometry(3,0.45,18,48),new THREE.MeshStandardMaterial({color:0x75d8ff,emissive:0x2a8fb0,emissiveIntensity:1.3}));
portal.position.set(0,3,24);scene.add(portal);

function makeChar(type){
 const g=new THREE.Group();
 const isIke=type==="Ike";
 const body=new THREE.Mesh(new THREE.CapsuleGeometry(.65,1.25,6,12),new THREE.MeshStandardMaterial({color:isIke?0x6f45a8:0xc95791}));
 body.position.y=1.25; body.castShadow=true; g.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.62,16,12),new THREE.MeshStandardMaterial({color:isIke?0x5a352a:0x75422f}));
 head.position.y=2.55;head.scale.set(.92,1,.92);head.castShadow=true;g.add(head);
 const hair=new THREE.Mesh(new THREE.SphereGeometry(.66,16,8),new THREE.MeshStandardMaterial({color:0x171318}));
 hair.position.set(0,2.88,0);hair.scale.set(1,.45,1);g.add(hair);
 for(const sx of [-.35,.35]){
  const leg=box(0,0,0,.32,.9,.32,0x22202a);leg.position.set(sx,.55,0);g.add(leg);
 }
 g.userData.type=type;return g;
}
const ike=makeChar("Ike"), yez=makeChar("Yez");
ike.position.set(-2,0,4);yez.position.set(2,0,4);
scene.add(ike,yez);

const enemies=[];
function makeEnemy(x,z){
 const g=new THREE.Group();
 const b=new THREE.Mesh(new THREE.SphereGeometry(.8,12,10),new THREE.MeshStandardMaterial({color:0x9a4e5e}));
 b.position.y=.8;b.castShadow=true;g.add(b);
 g.position.set(x,0,z);g.userData.hp=40;g.userData.enemy=true;scene.add(g);enemies.push(g);
}
[[-8,-5],[9,-3],[-8,14],[10,9]].forEach(p=>makeEnemy(...p));

let selected="Ike";
let player=ike, companion=yez;
let hp=100,connection=0,tension=0,orbCount=0;
let yaw=0, pitch=.32, locked=null, attackTimer=0, dodgeTimer=0;
const keys={};
const input={x:0,y:0};

function choose(type){
 selected=type;
 player=type==="Ike"?ike:yez;
 companion=type==="Ike"?yez:ike;
 document.querySelector("#select").style.display="none";
 document.querySelector("#who").textContent="Playing: "+selected;
 toast(selected+" selected. You control "+selected+" independently.");
 camera.position.set(player.position.x,7,player.position.z+10);
}
chooseIke.onclick=()=>choose("Ike");
chooseYez.onclick=()=>choose("Yez");

function toast(t){
 const el=document.querySelector("#toast");el.textContent=t;el.style.display="block";
 clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display="none",1800);
}
function addTension(n){tension=Math.min(100,tension+n);document.querySelector("#tension").textContent=tension}
function addConnection(n){connection=Math.min(100,connection+n);document.querySelector("#connection").textContent=connection}

document.addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
document.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

const stick=document.querySelector("#stick"),knob=document.querySelector("#knob");
let stickId=null;
stick.addEventListener("pointerdown",e=>{stickId=e.pointerId;stick.setPointerCapture(stickId);moveStick(e)});
stick.addEventListener("pointermove",e=>{if(e.pointerId===stickId)moveStick(e)});
stick.addEventListener("pointerup",resetStick);stick.addEventListener("pointercancel",resetStick);
function moveStick(e){
 const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy,max=50;
 const l=Math.hypot(dx,dy);if(l>max){dx*=max/l;dy*=max/l}
 knob.style.transform=`translate(${dx}px,${dy}px)`;
 input.x=dx/max;input.y=dy/max;
}
function resetStick(){stickId=null;knob.style.transform="";input.x=input.y=0}

function action(name){
 if(!player)return;
 if(name==="attack"){attackTimer=.28;addTension(2);hitEnemies()}
 if(name==="dodge"){dodgeTimer=.35}
 if(name==="guard"){toast(selected==="Ike"?"Ike raises Shield":"Yez braces herself");addConnection(1)}
 if(name==="ability"){
  if(selected==="Ike"){toast("Tactical Insight reveals the route");addConnection(4)}
  else{toast("Flood of Tears reshapes the path");addConnection(4)}
 }
 if(name==="interact"){
  const d=player.position.distanceTo(portal.position);
  if(d<6 && orbCount>=5){toast("The portal opens — where are we going?");document.querySelector("#objective").textContent="Portal unlocked!"}
  else if(d<6)toast("The portal needs 5 orbs.");
  else toast("Nothing nearby to interact with.");
 }
}
["attack","dodge","guard","ability","interact"].forEach(id=>document.querySelector("#"+id).addEventListener("pointerdown",()=>action(id)));

document.querySelector("#lock").addEventListener("pointerdown",()=>{
 if(locked){locked=null;toast("Lock-on released");return}
 let best=null,bd=14;
 for(const e of enemies){if(e.userData.hp>0){const d=player.position.distanceTo(e.position);if(d<bd){bd=d;best=e}}}
 locked=best;if(locked)toast("Target locked");else toast("No target in range");
});
document.querySelector("#switch").addEventListener("pointerdown",()=>{
 choose(selected==="Ike"?"Yez":"Ike");
});

function hitEnemies(){
 let target=locked;
 if(!target){
  let bd=3.2;
  for(const e of enemies){const d=player.position.distanceTo(e.position);if(e.userData.hp>0&&d<bd){bd=d;target=e}}
 }
 if(target){
  target.userData.hp-=20;
  const dir=target.position.clone().sub(player.position).normalize();
  target.position.addScaledVector(dir,1.5);
  if(target.userData.hp<=0){toast("Enemy defeated");addConnection(5)}
 }
}

function updateCompanion(dt){
 const target=new THREE.Vector3(player.position.x,0,player.position.z);
 target.add(new THREE.Vector3(selected==="Ike"?2:-2,0,1.5));
 companion.position.lerp(target,Math.min(1,dt*2.5));
 companion.lookAt(player.position.x,companion.position.y,player.position.z);
}

function movement(dt){
 let x=input.x,y=input.y;
 if(keys.a)x-=1;if(keys.d)x+=1;if(keys.w)y-=1;if(keys.s)y+=1;
 const mag=Math.min(1,Math.hypot(x,y)); if(mag<.05)return;
 const dir=new THREE.Vector3(x,0,y);
 dir.applyAxisAngle(new THREE.Vector3(0,1,0),yaw);
 dir.normalize();
 const speed=dodgeTimer>0?9:5.5;
 player.position.addScaledVector(dir,speed*dt*mag);
 player.position.x=THREE.MathUtils.clamp(player.position.x,-37,37);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-37,37);
 player.rotation.y=Math.atan2(dir.x,dir.z);
}

function updateCamera(dt){
 const target=player.position.clone().add(new THREE.Vector3(0,1.7,0));
 if(locked && locked.userData.hp>0){
  const mid=target.clone().add(locked.position).multiplyScalar(.5);
  const desired=mid.clone().add(new THREE.Vector3(0,6,10));
  camera.position.lerp(desired,Math.min(1,dt*5));
  camera.lookAt(mid);
 }else{
  const desired=new THREE.Vector3(
   player.position.x-Math.sin(yaw)*10,
   player.position.y+6.2,
   player.position.z-Math.cos(yaw)*10
  );
  camera.position.lerp(desired,Math.min(1,dt*5));
  camera.lookAt(target);
 }
}

function updateOrbs(){
 for(const o of scene.children){
  if(o.userData?.orb && o.visible && player.position.distanceTo(o.position)<1.6){
   o.visible=false;orbCount++;document.querySelector("#orbs").textContent=orbCount;toast("Orb collected");addConnection(2);
  }
 }
}
function updateEnemies(dt){
 for(const e of enemies){
  if(e.userData.hp<=0){e.visible=false;continue}
  e.rotation.y+=dt;
  const d=e.position.distanceTo(player.position);
  if(d<9 && d>1.8)e.position.lerp(player.position,dt*.25);
  if(d<1.7 && dodgeTimer<=0 && attackTimer<=0){hp=Math.max(0,hp-dt*5);document.querySelector("#hp").textContent=Math.round(hp)}
 }
}

let last=performance.now();
function loop(now){
 const dt=Math.min(.033,(now-last)/1000);last=now;
 attackTimer=Math.max(0,attackTimer-dt);dodgeTimer=Math.max(0,dodgeTimer-dt);
 portal.rotation.y+=dt*.7;
 movement(dt);updateCompanion(dt);updateCamera(dt);updateEnemies(dt);updateOrbs();
 document.querySelector("#objective").textContent=orbCount<5?`Find the 5 glowing orbs (${orbCount}/5)`:"Reach the portal and interact";
 renderer.render(scene,camera);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
